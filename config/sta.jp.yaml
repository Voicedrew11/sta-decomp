# splat configuration: Shadow Tower Abyss, Japanese retail (SLPS-25217)
#
# Splits baserom/jp/sta.rom (the boot ELF's PT_LOAD bytes; ROM offset 0 is
# VMA 0x00100000) into assembly and data. The retail ELF has no section table
# (mwldps2 wrote one PROGBITS blob), so the boundaries were found from the
# code and the placed library units: .text ends at 0x1EDE80 (libgraph's .data
# version string follows), every .data then every .rodata share the range up
# to .sdata (the .rodata run starts at libgraph's "rom0:ROMVER", 0x1F8880),
# .sdata starts at _gp - 0x7FF0, .sbss ends where crt0's .bss begins.
# tools/carve.py writes the subsegment list between its markers below: one
# subsegment per library unit and section, and asm units for the stretches
# between them.

name: sta
sha1: e2742b309441802b4a6809a346760a2dfcc6fd4d
options:
  basename: sta
  target_path: baserom/jp/sta.rom
  elf_path: build/sta.elf
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  # _gp from the ELF's .reginfo (ri_gp_value).
  gp_value: 0x00209B70
  ld_gp_expression: "0x00209B70"

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/splat.ld   # unused; tools/gen_ninja.py writes build/sta.ld

  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.carve.txt   # generated by tools/carve.py
  undefined_funcs_auto_path: config/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/undefined_syms_auto.txt

  find_file_boundaries: False
  disassemble_all: True
  create_c_files: False
  # hand-written library asm (src/sce/**/*.s) is a hasm unit; splat never overwrites it
  hasm_in_src_path: True
  migrate_rodata_to_functions: False

  use_gp_rel_macro_nonmatching: True
  generate_asm_macros_files: False   # include/macro.inc is hand-written for the period assembler
  # The binary holds Shift-JIS text; only plain ASCII is emitted as strings
  # so the assembler sees the original bytes.
  string_encoding: ASCII
  data_string_encoding: ASCII
  # the period assembler only knows numeric register names.
  mips_abi_gpr: numeric
  mips_abi_float_regs: numeric
  section_order: [".text", ".data", ".rodata", ".sdata", ".sbss", ".bss"]

segments:
  - name: main
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0x2BC300   # .sbss 0x201E80, .bss 0x202480 .. 0x4BE180
